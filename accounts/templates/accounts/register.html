{% extends 'accounts/base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card ticket-card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="stop-marker mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.8rem;">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h2 class="page-title mb-1">Create Account</h2>
                    <p class="text-muted mb-0">Join ASANA to start navigating</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100 mt-2">
                        <i class="bi bi-check-circle me-1"></i>Register
                    </button>
                </form>
                <hr class="my-4">
                <p class="text-center mb-0">
                    Already registered? <a href="{% url 'login' %}" class="fw-bold text-decoration-none">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
